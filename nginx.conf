server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker / Telegram local-dev friendly limits
    client_max_body_size 25m;

    # React/Vite static assets
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Backend API proxied through the same public HTTPS origin.
    # Frontend must call: /api/...
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tenant context for local Telegram/dev testing.
        # Prefer resolving tenant/company from auth claims in production.
        proxy_set_header X-Tenant-Id ambassador;
        proxy_set_header X-Company-Id 3ce60a94-8ca8-4bf6-8330-2fb93415f2f5;
    }

    # Swagger proxied through the same origin for local diagnostics:
    # http://localhost:3000/swagger/index.html
    location /swagger/ {
        proxy_pass http://api:8080/swagger/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# /etc/nginx/conf.d/fnbnova.conf

upstream restaurantfnb_api {
    zone restaurantfnb_api 64k;

    # Docker Compose service name.
    server api:8080;

    keepalive 32;
}

# WebSocket-safe connection mapping.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Reject requests with unknown Host headers.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    return 444;
}

# Redirect the approved production domains to HTTPS.
server {
    listen 80;
    listen [::]:80;

    server_name fnbnova.com *.fnbnova.com;

    return 308 https://$host$request_uri;
}

# Reject unknown TLS hostnames.
#
# This requires a fallback certificate because TLS negotiation occurs
# before NGINX can evaluate the HTTP Host header.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;

    ssl_certificate     /etc/letsencrypt/live/fnbnova.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fnbnova.com/privkey.pem;

    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    http2 on;

    server_name fnbnova.com *.fnbnova.com;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Covers fnbnova.com and *.fnbnova.com.
    ssl_certificate     /etc/letsencrypt/live/fnbnova.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fnbnova.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FnbNovaTls:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Enable only after HTTPS is verified on the root and every tenant domain.
    add_header Strict-Transport-Security
        "max-age=31536000; includeSubDomains"
        always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy
        "camera=(), microphone=(), geolocation=()"
        always;

    # Consider replacing this with a strict application-specific CSP.
    add_header Content-Security-Policy
        "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';"
        always;

    server_tokens off;

    client_max_body_size 25m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 60s;

    # Prevent access to hidden and configuration files.
    location ~ /\.(?!well-known/) {
        deny all;
    }

    location ~* \.(?:env|ini|log|sql|bak|config|ya?ml)$ {
        deny all;
    }

    location = /health {
        access_log off;

        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        try_files $uri =404;

        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        access_log off;
    }

    location /api/ {
        proxy_pass http://restaurantfnb_api/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_request_buffering on;
        proxy_buffering on;

        proxy_hide_header X-Powered-By;

        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
    }

    # Do not expose Swagger publicly in production unless operationally required.
    #
    # A safer approach is to remove this location entirely and expose Swagger
    # only through a VPN, internal hostname, or authenticated admin gateway.
    location /swagger/ {
        proxy_pass http://restaurantfnb_api/swagger/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        try_files $uri =404;

        add_header Cache-Control
            "no-cache, no-store, must-revalidate"
            always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
